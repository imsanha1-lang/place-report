<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>플레이스 비교하기</title>
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--line:#E5E8EB;--ink:#191F28;--sub:#333D4B;--muted:#6B7684;--faint:#B0B8C1;--field:#F2F4F6;
  --green:#03C75A;--green-h:#02B350;--green-d:#0A7F41;--green-soft:#E6F8EE;--red:#F04452;--red-d:#D22030;--red-soft:#FFEEEF;
  --amber:#E58A00;--amber-d:#A35F00;--amber-soft:#FFF4E0;--bar:#C9D1DA;--mine-bg:#F0FAF4;--mine-pink:#FFF0F2;--mine-green:#E9F8EF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:40px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none}
.brand{color:inherit;text-decoration:none}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:12px}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;background:var(--card)}
.wk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;background:var(--field);color:var(--muted)}
.wk i{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.wk.on{background:var(--green-soft);color:var(--green-d)}.wk.on i{background:var(--green)}
.wk.off{background:var(--red-soft);color:var(--red-d)}.wk.off i{background:var(--red)}
h1{font-size:24px;margin:18px 0 4px}
.info{color:var(--muted);font-size:13px;line-height:1.5}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.sec h2{font-size:18px;margin:0}.sec span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}h1{font-size:20px}}
/* 입력 */
.form{max-width:560px;margin:6vh auto 0;padding:28px}
.form h1{margin:0 0 6px;font-size:26px}.form>p{color:var(--muted);margin:0 0 8px;font-size:14px}
.fl{display:block;font-size:14px;font-weight:700;color:var(--sub);margin:20px 0 8px}
.in{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:var(--field);color:var(--ink);outline:none}
.in:focus{border-color:var(--green);background:var(--card);box-shadow:0 0 0 4px var(--green-soft)}
.hint{color:var(--muted);font-size:12px;margin-top:7px}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--field);border-radius:12px;padding:4px}
.seg5 button{height:40px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
.seg5 button.on{background:var(--green);color:#fff}
.go{width:100%;height:56px;border:0;border-radius:14px;background:var(--green);color:#fff;font:inherit;font-size:17px;font-weight:700;margin-top:28px;cursor:pointer}
.go:hover{background:var(--green-h)}.go:disabled{background:#7FD9A6;cursor:default}
.msg{margin-top:12px;font-size:14px;color:var(--red-d);min-height:1em}
.recent{max-width:560px;margin:18px auto 0}
.recent h3{font-size:14px;color:var(--muted);margin:0 0 8px 4px}
.ritem{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;flex-wrap:wrap}
.ritem:hover{border-color:var(--green);background:var(--mine-bg)}
.ritem .t{color:var(--muted);font-size:12px;margin-left:auto}
.ritem .m{color:var(--muted);font-size:13px}
/* 진행 */
.wait{max-width:560px;margin:8vh auto 0;padding:32px 28px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--green-soft);border-top-color:var(--green);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wait b{display:block;font-size:20px;margin-bottom:8px}.wait p{color:var(--muted);margin:4px 0;font-size:14px;line-height:1.6}
.wait .q{color:var(--sub);font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.wait .btns{justify-content:center}
.note{background:var(--amber-soft);color:var(--amber-d);border-radius:12px;padding:12px 16px;font-size:14px;margin-top:14px;line-height:1.5}
/* 요약 */
.hero{display:flex;gap:20px;padding:18px;align-items:center;flex-wrap:wrap}
.rankbox{width:190px;min-height:150px;border-radius:14px;background:var(--green-soft);color:var(--green-d);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.rankbox.ad{background:#E8F3FF;color:#1B64DA}
.rankbox.plain{background:var(--field);color:var(--muted)}
@media (max-width:480px){.rankbox{width:calc(50% - 10px);min-height:120px}.rankbox .big{font-size:34px}}
.rankbox .l{font-size:13px;font-weight:700}.rankbox .big{font-size:42px;font-weight:800;line-height:1.25}.rankbox .s{font-size:12px}
.hero .txt{flex:1;min-width:220px}.hero .txt b{font-size:24px;display:block}
.hero .txt p{color:var(--muted);margin:6px 0 14px;font-size:14px}
.pill{display:inline-block;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;margin:0 6px 6px 0;background:var(--field);color:var(--sub)}
.pill.good{background:var(--green-soft);color:var(--green-d)}.pill.bad{background:var(--red-soft);color:var(--red-d)}.pill.warn{background:var(--amber-soft);color:var(--amber-d)}
/* 막대 */
.mcard{padding:16px 22px 14px}
.mcard .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.mcard .hd b{font-size:15px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;font-size:14px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.bar .v{text-align:right}
.bar .t{height:12px;border-radius:6px;background:var(--field);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--bar)}
.bar.mine{font-weight:700}.bar.mine.good{background:var(--mine-green)}.bar.mine.bad{background:var(--mine-pink)}
.bar.mine.good .t i{background:var(--green)}.bar.mine.bad .t i{background:var(--red)}
.bar.mine.good .v{color:#16A34A}.bar.mine.bad .v{color:#E5484D}
.bar.plain .t i{background:var(--green)}
.avg{text-align:right;color:var(--muted);font-size:12px;margin-top:6px}
@media (max-width:480px){.bar{grid-template-columns:110px 1fr 58px;font-size:13px}}
/* 진단 */
.dcard{padding:18px 22px}
.dcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;font-size:15px}
.dot{width:30px;height:30px;border-radius:15px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.tip{border-radius:10px;padding:11px 16px;margin:8px 0}
.tip b{display:block;font-size:14px}.tip p{margin:3px 0 0;font-size:13px;color:var(--sub);line-height:1.5}
.tip.w{background:var(--amber-soft)}.tip.w b,.tip.w em{color:var(--amber-d)}
.tip.s{background:var(--green-soft)}.tip.s b,.tip.s em{color:var(--green-d)}
.tip em{font-style:normal;font-weight:700}
/* 표 */
.tbl{overflow-x:auto;padding:12px 16px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{font-size:12px;color:var(--sub);font-weight:700;padding:10px 12px;white-space:pre-line;text-align:center;background:var(--field)}
td{padding:10px 12px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}td.c{text-align:center}
tr:nth-child(even) td{background:#FAFBFC}
.mc{background:var(--mine-bg)!important}
th.mc{color:var(--green-d)}
.good{color:var(--green-d)}.bad{color:var(--red-d)}.muted{color:var(--muted)}.b{font-weight:700}
.on{color:var(--green-d);font-weight:700}.off{color:#C4CAD2;font-weight:700}
/* 매장 특징 · 디자이너 */
.fcard{padding:18px 22px}
.fcard.mine{background:var(--mine-bg);border-color:#BFEBD2}
.fcard .hd{display:flex;align-items:center;gap:10px}
.lab{color:#fff;background:var(--sub);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;flex:none}
.fcard.mine .lab{background:var(--green)}
.fcard .nm{font-weight:700;font-size:15px;color:inherit;text-decoration:none}
a.nm:hover{text-decoration:underline}
.fcard .meta{color:var(--muted);font-size:13px;margin-top:8px}
.ptitle{display:inline-block;border:1.5px solid var(--faint);border-radius:14px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px;background:var(--card)}
.fcard.mine .ptitle{border-color:var(--green);color:var(--green-d)}
.fbar{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center;height:28px;font-size:13px}
.fbar .t{height:8px;border-radius:4px;background:var(--field)}.fbar .t i{display:block;height:100%;border-radius:4px;background:var(--bar)}
.fcard.mine .fbar .t i{background:var(--green)}
.fbar .v{text-align:right}.fbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.fbar{grid-template-columns:120px 1fr 48px}}
.empty{padding:44px 24px;text-align:center;color:var(--muted)}
.err{padding:30px;text-align:center;color:var(--red-d)}
.foot{color:var(--faint);font-size:12px;margin-top:30px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#">N</a>
  <a class="brand" href="#"><b>플레이스 비교하기</b><small>네이버 지도 상위 매장 vs 내 매장</small></a>
  <div class="ctl"><span class="wk" id="wk" title="분석은 사무실 PC가 해요"><i></i><span>확인 중</span></span><a class="link" href="./">매일 분석 보기</a></div>
</div></header>
<main class="wrap">
  <div id="view"><div class="empty">불러오는 중...</div></div>
  <div class="foot">공개된 네이버 지도 정보를 가져와요 · 광고 제외 PC 지도 순위 · 내 매장을 넣으면 내 매장 위치 기준으로 검색해요<br>분석은 사무실 PC가 한 번에 한 건씩 해요. PC가 꺼져 있으면 켜질 때까지 대기해요.</div>
</main>
<script>
const SB_URL = 'https://eiuggeablsorgwcozphs.supabase.co';
const SB_KEY = 'sb_publishable_Bd3MAEmsfEHscxM8HH4DgA_xVAbBiZZ';  // 공개용 키 (함수 3개만 쓸 수 있음)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HKEY = 'place_compare_history', FKEY = 'place_compare_form';
let timer = null, viewId = 0;

async function rpc(name, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, {method: 'POST', headers: {apikey: SB_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(args || {})});
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && j.message) || `서버 오류 (${r.status})`);
  return j;
}
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function remember(item) {
  const h = store.get(HKEY, []).filter(x => x.id !== item.id);
  h.unshift(item); store.set(HKEY, h.slice(0, 30));
}
function patchHistory(id, fields) {
  const h = store.get(HKEY, []); const x = h.find(v => v.id === id);
  if (x) { Object.assign(x, fields); store.set(HKEY, h); }
}
const ago = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

/* ---- 분석 PC 연결 상태 ---- */
function setWorker(seen, now) {
  const el = $('#wk'), on = seen && (new Date(now) - new Date(seen)) < 3 * 60 * 1000;
  el.className = 'wk ' + (on ? 'on' : 'off');
  el.querySelector('span').textContent = on ? '분석 PC 연결됨' : '분석 PC 꺼져 있음';
  return on;
}
async function pingWorker() { try { const w = await rpc('place_worker_seen'); setWorker(w.seen_at, w.now); } catch (e) {} }

/* ---- 화면 전환 ---- */
function route() {
  clearTimeout(timer); viewId++;
  const m = location.hash.match(/^#job=([0-9a-f-]{36})/i);
  if (m) showJob(m[1], viewId); else showForm();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function showForm(pre) {
  const f = pre || store.get(FKEY, {keyword: '', mine: '', top: 3});
  const hist = store.get(HKEY, []);
  $('#view').innerHTML = `<div class="card form"><h1>플레이스 비교하기</h1><p>검색 키워드 상위 매장과 내 매장을 나란히 비교해요.</p>
    <form id="f" autocomplete="off">
      <label class="fl" for="kw">검색 키워드</label><input class="in" id="kw" placeholder="예: 강남역미용실" maxlength="50" value="${esc(f.keyword)}">
      <label class="fl" for="mine">내 매장</label><input class="in" id="mine" placeholder="네이버 지도 URL · 플레이스 ID · 매장명" maxlength="300" value="${esc(f.mine)}">
      <div class="hint">비워 두면 상위 매장끼리만 비교해요.</div>
      <div class="fl">비교할 상위 매장 수</div><div class="seg5" id="top">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n === +f.top ? 'on' : ''}">${n}</button>`).join('')}</div>
      <button class="go" id="go" type="submit">비교 시작</button><div class="msg" id="msg"></div>
    </form></div>` +
    (hist.length ? `<div class="recent"><h3>최근 분석 (이 기기에만 저장돼요)</h3>${hist.map(h => `<button class="ritem" data-id="${h.id}"><b>${esc(h.keyword)}</b><span class="m">${esc(h.mine || '내 매장 미입력')} · 상위 ${h.top}곳${h.rank ? ' · ' + esc(h.rank) : ''}</span><span class="t">${ago(h.at)}</span></button>`).join('')}</div>` : '');
  let top = +f.top || 3;
  $('#top').querySelectorAll('button').forEach(b => b.onclick = () => { top = +b.dataset.n; $('#top').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  document.querySelectorAll('.ritem').forEach(b => b.onclick = () => { location.hash = 'job=' + b.dataset.id; });
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const keyword = $('#kw').value.trim(), mine = $('#mine').value.trim();
    if (!keyword) { $('#msg').textContent = '검색 키워드를 입력하세요.'; $('#kw').focus(); return; }
    store.set(FKEY, {keyword, mine, top});
    $('#go').disabled = true; $('#go').textContent = '요청하는 중...'; $('#msg').textContent = '';
    try {
      const id = await rpc('place_submit', {p_keyword: keyword, p_mine: mine, p_top: top});
      remember({id, keyword, mine, top, at: new Date().toISOString()});
      location.hash = 'job=' + id;
    } catch (ex) {
      $('#msg').textContent = ex.message; $('#go').disabled = false; $('#go').textContent = '비교 시작';
    }
  };
  if (!f.keyword) $('#kw').focus();
}

async function showJob(id, vid) {
  let j;
  try { j = await rpc('place_get', {p_id: id}); }
  catch (ex) { if (vid !== viewId) return; $('#view').innerHTML = `<div class="card wait"><b>불러오지 못했어요</b><p>${esc(ex.message)}</p><div class="btns"><button class="btn pri" onclick="route()">다시 시도</button><a class="btn" href="#">처음으로</a></div></div>`; return; }
  if (vid !== viewId) return;
  if (!j) { $('#view').innerHTML = `<div class="card wait"><b>이 분석 기록을 찾을 수 없어요</b><p>오래된 기록은 지워져요 (60일).</p><div class="btns"><a class="btn pri" href="#">새로 분석하기</a></div></div>`; return; }
  const online = setWorker(j.worker_seen, j.now);
  const again = `<button class="btn" id="again">같은 조건으로 다시 분석</button><a class="btn" href="#">새 분석</a>`;
  if (j.status === 'done' && j.result) {
    patchHistory(id, {rank: j.result.my_rank_text});
    renderReport(j); bindAgain(j); return;
  }
  if (j.status === 'error') {
    $('#view').innerHTML = `<div class="card wait"><b style="color:var(--red-d)">분석하지 못했어요</b><p>${esc(j.error)}</p><p class="muted">“${esc(j.keyword)}” · ${esc(j.mine || '내 매장 미입력')}</p><div class="btns">${again}</div></div>`;
    bindAgain(j); return;
  }
  let line, sub = '';
  if (j.status === 'running') { line = '분석하는 중이에요'; sub = esc(j.progress || ''); }
  else if (!online) { line = '분석 PC가 꺼져 있어요'; sub = '사무실 PC가 켜지면 자동으로 분석을 시작해요. 이 화면을 닫아도 돼요.'; }
  else { line = '순서를 기다리는 중이에요'; sub = j.ahead ? `앞에 <span class="q">${j.ahead}건</span>이 있어요.` : '곧 시작해요.'; }
  $('#view').innerHTML = `<div class="card wait"><div class="spin"></div><b>${line}</b><p>${sub}</p><p class="muted">“${esc(j.keyword)}” · ${esc(j.mine || '내 매장 미입력')} · 상위 ${j.top_n}곳</p><p class="muted" style="font-size:12px">보통 20~40초 걸려요. 이 주소를 저장해 두면 나중에 다시 볼 수 있어요.</p><div class="btns"><a class="btn" href="#">처음으로</a></div></div>`;
  timer = setTimeout(() => showJob(id, vid), 2000);
}
function bindAgain(j) {
  const b = $('#again'); if (!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = '요청하는 중...';
    try {
      const id = await rpc('place_submit', {p_keyword: j.keyword, p_mine: j.mine, p_top: j.top_n});
      remember({id, keyword: j.keyword, mine: j.mine, top: j.top_n, at: new Date().toISOString()});
      location.hash = 'job=' + id;
    } catch (ex) { b.disabled = false; b.textContent = '같은 조건으로 다시 분석'; alertBox(ex.message); }
  };
}
function alertBox(t) { const d = document.createElement('div'); d.className = 'note'; d.textContent = t; $('#view').prepend(d); setTimeout(() => d.remove(), 6000); }

/* ---- 리포트 (비교기 화면과 같은 순서) ---- */
const sec = (t, d) => `<div class="sec"><h2>${t}</h2><span>${d}</span></div>`;
function renderReport(j) {
  const R = j.result, r = R.report;
  let html = `<h1>“${esc(R.keyword)}” 분석 리포트</h1><div class="info">${esc(r.time)} 조회 · 전체 ${(r.total || 0).toLocaleString()}개 매장 중 상위 ${r.summary.n}곳 · 광고 제외${r.summary.has_mine ? ' · 내 매장 위치 기준' : ''}</div>`;
  html += `<div class="btns">${`<button class="btn pri" id="again">같은 조건으로 다시 분석</button><a class="btn" href="#">새 분석</a>`}</div>`;
  if (R.note) html += `<div class="note">${esc(R.note)}</div>`;
  html += secSummary(r) + secMetrics(r) + secPayments(R.payments) + (r.summary.has_mine ? secDiag(r) : '') + secChecks(r) + secFeatures(r, R) + secTable(r);
  $('#view').innerHTML = html;
}
function secSummary(r) {
  const s = r.summary;
  if (!s.has_mine) return `<div class="card hero" style="margin-top:16px"><div class="rankbox plain"><div class="l">비교 매장</div><div class="big">${s.n}곳</div></div><div class="txt"><b>상위 ${s.n}곳을 비교했어요</b><p>내 매장을 입력하고 다시 비교하면 내 순위와 보완할 점까지 정리해 드려요.</p></div></div>`;
  return `<div class="card hero" style="margin-top:16px">
    <div class="rankbox"><div class="l">내 매장 순위</div><div class="big">${s.rank ? s.rank + '위' : '순위 밖'}</div><div class="s">${s.searched}위까지 확인</div></div>
    ${s.ad_rank ? `<div class="rankbox ad"><div class="l">광고 순위</div><div class="big">${s.ad_rank}위</div><div class="s">광고 포함 순위</div></div>` : ''}
    <div class="txt"><b>${esc(s.head)}</b><p>${esc(s.name)} · “${esc(s.keyword)}” 검색 상위 ${s.n}곳과 비교</p>
      <span class="pill ${s.weak ? 'warn' : ''}">보완할 점 ${s.weak}개</span><span class="pill ${s.strong ? 'good' : ''}">강점 ${s.strong}개</span>${s.rep_price ? `<span class="pill">대표 가격 ${esc(s.rep_price)}</span>` : ''}
    </div></div>`;
}
function secMetrics(r) {
  return sec('핵심 지표 비교', '막대가 길수록 많아요 · 내 매장은 평균 이상 초록, 미만 빨강') + '<div class="grid2">' +
    r.metrics.map(m => `<div class="card mcard"><div class="hd"><b>${esc(m.title)}</b>${m.pct == null ? '' : `<span class="pill ${m.pct >= 0 ? 'good' : 'bad'}" style="margin:0">평균 대비 ${m.pct >= 0 ? '▲' : '▼'} ${Math.abs(m.pct).toFixed(0)}%</span>`}</div>` +
      m.rows.map(b => `<div class="bar ${b.mine ? 'mine ' + b.kind : b.kind}"><span class="n">${esc(b.label)}</span><span class="t"><i style="width:${(b.ratio * 100).toFixed(1)}%"></i></span><span class="v">${esc(b.value)}</span></div>`).join('') +
      (m.avg != null ? `<div class="avg">상위 평균 ${m.avg}</div>` : '') + '</div>').join('') + '</div>';
}
function secPayments(list) {
  if (!list || !list.length) return '';
  return sec('디자이너별 최근 스타일링', "플레이스 디자이너 카드의 '최근 N건 스타일링' · 스타일 키워드가 입력된 결제완료 예약 수 · 숨긴 디자이너는 빠져요") + '<div class="grid2">' +
    list.map(p => { const top = (p.items[0] || [0, 1])[1] || 1;
      return `<div class="card fcard ${p.mine ? 'mine' : ''}"><div class="hd"><span class="lab">${esc(p.lab)}</span><span class="nm">${esc(p.name)}</span></div>` +
        `<div class="meta">${p.total != null ? `합계 ${p.total.toLocaleString()}건 · 디자이너 ${p.designers}명` : '정보 없음'}</div>` +
        p.items.map(([n, v]) => `<div class="fbar"><span class="n">${esc(n)}</span><span class="t"><i style="width:${(v / top * 100).toFixed(1)}%"></i></span><span class="v">${v.toLocaleString()}</span></div>`).join('') + '</div>'; }).join('') + '</div>';
}
function secDiag(r) {
  const em = t => esc(t).replace(/\d[\d,]*(?:\.\d+)?%/g, m => `<em>${m}</em>`);
  const col = (title, items, good) => `<div class="card dcard"><div class="hd"><span class="dot" style="background:${good ? 'var(--green)' : 'var(--amber)'}">${good ? '✓' : '!'}</span>${title}  ${items.length}</div>` +
    (items.length ? items.map(t => `<div class="tip ${good ? 's' : 'w'}"><b>${esc(t.head)}</b><p>${em(t.text)}</p></div>`).join('') : '<div class="muted">눈에 띄게 차이 나는 항목이 없어요.</div>') + '</div>';
  return sec('내 매장 진단', '상위 평균과 차이가 큰 항목만 골랐어요') + `<div class="grid2">${col('보완할 점', r.weak, false)}${col('강점', r.strong, true)}</div>`;
}
function secChecks(r) {
  const c = r.checks;
  return sec('운영 현황', '손님이 플레이스에서 바로 쓸 수 있는 기능') + `<div class="card tbl"><table><tr><th></th>${c.stores.map(s => `<th class="${s.mine ? 'mc' : ''}">${esc(s.lab)}\n${esc(s.name)}</th>`).join('')}</tr>` +
    c.rows.map(row => `<tr><td>${esc(row.title)}</td>${row.cells.map((x, i) => `<td class="c ${x.on ? 'on' : 'off'} ${c.stores[i].mine ? 'mc' : ''}">${esc(x.text)}</td>`).join('')}</tr>`).join('') + '</table></div>';
}
function secFeatures(r, R) {
  const urls = (R.stores || []).map(s => s.url).concat(R.mine_url ? [R.mine_url] : []);
  return sec('매장별 특징', '손님 리뷰 키워드 TOP 5와 인기 스타일 전체 · 매장명을 누르면 네이버 지도로 열려요') + '<div class="grid2">' +
    r.features.map((f, i) => `<div class="card fcard ${f.mine ? 'mine' : ''}"><div class="hd"><span class="lab">${esc(f.lab)}</span>${urls[i] ? `<a class="nm" href="${esc(urls[i])}" target="_blank" rel="noopener">${esc(f.name)}</a>` : `<span class="nm">${esc(f.name)}</span>`}</div>` +
      (f.meta ? `<div class="meta">${esc(f.meta)}</div>` : '') +
      f.sections.map(sc => { const top = sc.items[0][1] || 1; return `<div class="ptitle">${esc(sc.title)}</div>` + sc.items.map(([n, v]) => `<div class="fbar"><span class="n">${esc(n)}</span><span class="t"><i style="width:${(v / top * 100).toFixed(1)}%"></i></span><span class="v">${v.toLocaleString()}</span></div>`).join(''); }).join('') +
      '</div>').join('') + '</div>';
}
function secTable(r) {
  const t = r.table, mc = t.mine_col;
  return sec('전체 수치표', '값이 있는 항목만 표시해요') + `<div class="card tbl"><table><tr>${t.head.map((h, i) => `<th class="${i ? 'r' : ''} ${i === mc ? 'mc' : ''}">${esc(h)}</th>`).join('')}</tr>` +
    t.rows.map(row => `<tr>${row.map((c, i) => `<td class="${i ? 'r' : ''} ${c.c || ''} ${c.b ? 'b' : ''} ${i === mc ? 'mc' : ''}">${esc(c.t)}</td>`).join('')}</tr>`).join('') + '</table></div>';
}

pingWorker(); setInterval(pingWorker, 60000);
route();
</script>
</body>
</html>
